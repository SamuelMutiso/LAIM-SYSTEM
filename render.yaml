services:
  - type: web
    name: laim-office-api
    runtime: python
    rootDir: backend
    branch: main
    region: frankfurt
    plan: starter
    buildCommand: pip install --upgrade pip pipenv && pipenv requirements > /tmp/requirements.txt && pip install -r /tmp/requirements.txt && flask db upgrade && flask setup
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_APP
        value: wsgi.py
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: laim-office-db
          property: connectionString
      - key: RATELIMIT_STORAGE_URI
        fromService:
          type: keyvalue
          name: laim-office-limits
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false

  - type: keyvalue
    name: laim-office-limits
    region: frankfurt
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: laim-office-db
    region: frankfurt
    plan: basic-256mb
    databaseName: laim_office
    user: laim
